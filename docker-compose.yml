version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: duclaw-db
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: duclaw
      POSTGRES_USER: duclaw
      POSTGRES_PASSWORD: duclaw2024!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - duclaw-network

  redis:
    image: redis:7-alpine
    container_name: duclaw-redis
    restart: unless-stopped
    ports:
      - "6378:6379"
    networks:
      - duclaw-network

  backend:
    build:
      context: ./du-claw-backend
      dockerfile: Dockerfile
    container_name: duclaw-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://duclaw:duclaw2024!@db:5432/duclaw
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-your-key-here}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      WECHAT_APPID: ${WECHAT_APPID:-wx_your_appid}
      WECHAT_SECRET: ${WECHAT_SECRET:-your_secret}
      WECHAT_TOKEN: ${WECHAT_TOKEN:-your_token}
      WECHAT_AES_KEY: ${WECHAT_AES_KEY:-your_aes_key}
      SERVER_HOST: 8.159.152.197
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-change-me}
      JWT_ALGORITHM: HS256
    networks:
      - duclaw-network

volumes:
  postgres_data:

networks:
  duclaw-network:
    driver: bridge